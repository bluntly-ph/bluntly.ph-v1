name: CI

# Added 2026-08-19. Not a contractual deliverable — justified by the production
# safety incident: the full test suite was run against the live database and
# created hundreds of fixture reviews. The most important job here is not the
# tests, it is `guard`: it proves on every push that automated commands still
# refuse a production target.
#
# Everything below runs WITHOUT secrets. DB-backed tests run on every PR and push
# against an EPHEMERAL Postgres 17 inside the runner (`backend-pg`), which is
# created for the job and thrown away after it. The remote TEST-project job
# (`backend-db-tests`) needs repository secrets and runs only on demand. There
# is no path in this file that can reach production: the guard fails the job
# closed if a production target is ever configured.
#
# ACTIONS MINUTES (2026-10-07). The account ran past GitHub Free's 2,000
# minutes and CI stopped. So: the remote TEST run lost its weekly schedule (up
# to 270 minutes a time); push runs only on main, as every other branch is
# covered by its pull request; and a change that touches only docs runs the
# guard alone — the other jobs report "skipped", which satisfies a required
# check. The three docs files that tests read count as code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  guard:
    name: Production guard
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only? Anything unsure (a new branch, a manual run, a missing
      # commit) counts as code, so the full suite runs.
      - name: What changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && ! [[ "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
            echo "$files"
            # Markdown and docs/, except the three docs files tests read.
            rest=$( (echo "$files" | grep -vE '\.md$|^docs/' || true)
                    (echo "$files" | grep -xE 'docs/(openapi\.json|schema\.md|SITEMAP\.md)' || true) )
            if [ -n "$files" ] && [ -z "$(echo "$rest" | tr -d '[:space:]')" ]; then
              code=false
              echo "::notice::Docs-only change: only the production guard runs."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]" || pip install -r requirements.txt

      # The guard's own tests: production is detected, an undeclared target
      # fails closed, and a test marker alone cannot unlock production.
      - name: Guard unit tests
        working-directory: backend
        env:
          BLUNTLY_TEST_ENV: "1"
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: python -m pytest tests/test_env_guard.py -q

      # Belt and braces: assert that a *simulated* production configuration is
      # actually refused, rather than trusting the unit tests alone.
      - name: Refuses a production target
        working-directory: backend
        env:
          SUPABASE_URL: https://byobedbhodhvocgrkrse.supabase.co
        run: |
          if python -m pytest tests/test_health.py -q; then
            echo "::error::pytest did NOT refuse a production target"
            exit 1
          fi
          echo "pytest correctly refused a production target"

  backend:
    name: Backend (no database)
    needs: guard
    if: ${{ needs.guard.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]" || pip install -r requirements.txt

      # Runs BEFORE pytest, and is not optional.
      #
      # On 2026-08-20 an edit to review_service referenced `author.id` in a
      # function whose parameter is `author_id`. Every review submission would
      # have raised NameError. The suite stayed green at 403 passed, because
      # every review-creation test is `requires_db` and skips itself without a
      # Postgres — exactly the condition this job runs in. Ruff reports it as
      # F821 in about a second.
      #
      # While the DB-backed half of the suite is unavailable, static analysis is
      # the only thing between an edit and production.
      - name: ruff
        working-directory: backend
        run: |
          pip install ruff
          # Tests included, with no carve-out. They were clean as of the commit
          # that added this, and a test that quietly references nothing is not
          # a test — three here registered a moderator they never used.
          python -m ruff check app/ scripts/ tests/

      # DB-backed tests skip themselves via `requires_db` when no Postgres is
      # reachable, so this runs the unit half of the suite.
      - name: pytest
        working-directory: backend
        env:
          BLUNTLY_TEST_ENV: "1"
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          EMAIL_PROVIDER: console
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789ab
        run: python -m pytest -q

      - name: Migration safety report
        working-directory: backend
        env:
          BLUNTLY_TEST_ENV: "1"
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        # Advisory: prints which migrations need a deliberate rollout order.
        run: python -m scripts.check_migration_safety --all

  # The full DB-backed suite on every PR and push, against a Postgres 17 that
  # exists only for this job (2026-10-04). It replaces the remote TEST project as
  # the gate: from a GitHub runner every query to ap-southeast-1 paid a round
  # trip, and that job outgrew a 270-minute limit (main run 37183348786) while
  # the same suite takes ~7 minutes against a local database. A fresh database
  # per run also means no accumulated fixtures (the TEST project's ~4,250 stale
  # pending reviews) and no shared writer to serialise on.
  backend-pg:
    name: Backend (ephemeral Postgres 17)
    needs: guard
    if: ${{ needs.guard.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BLUNTLY_TEST_ENV: "1"
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ci
      EMAIL_PROVIDER: console
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789ab
      # Many tests sign in from one runner IP within seconds.
      AUTH_RATE_LIMIT_MAX: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]" || pip install -r requirements.txt
      # Migrations grant and revoke on Supabase's API roles; plain Postgres has none.
      - name: Supabase role stand-ins
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='supabase_admin') THEN CREATE ROLE supabase_admin NOLOGIN; END IF;
            END \$\$;"
      - name: Migrate to head
        working-directory: backend
        run: python -m alembic upgrade head
      - name: pytest (full suite)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider -o console_output_style=classic

  backend-db-tests:
    name: Backend (isolated database)
    runs-on: ubuntu-latest
    # One writer at a time on bluntly-ph-test: the defense workflow's
    # populate-test job (defense.yml) resets and seeds the same project.
    concurrency:
      group: bluntly-ph-test
      cancel-in-progress: false
    # Opt-in. Runs only once the test project's credential is in repository
    # secrets. It can never fall back to production: the connection string is
    # required, and the guard refuses a production target regardless.
    #
    # Since 2026-10-04 the PR/push gate is `backend-pg` (ephemeral Postgres).
    # This remote run stays as an on-demand check (Actions → CI → Run workflow)
    # that the suite also passes on Supabase itself (pooler, roles, extensions).
    # Its weekly schedule was dropped on 2026-10-07: up to 270 minutes a run.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the test database is not configured
        id: gate
        env:
          TEST_DSN: ${{ secrets.TEST_SUPABASE_SESSION_POOLER }}
        run: |
          if [ -z "$TEST_DSN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TEST_SUPABASE_SESSION_POOLER not set - DB-backed tests skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        if: steps.gate.outputs.configured == 'true'
        working-directory: backend
        run: pip install -e ".[dev]" || pip install -r requirements.txt
      - name: Migrate, test, and verify milestones
        if: steps.gate.outputs.configured == 'true'
        working-directory: backend
        env:
          BLUNTLY_TEST_ENV: "1"
          APP_ENV: test
          USE_SUPABASE: "true"
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          SUPABASE_CONNECTION_STRING_SESSION_POOLER: ${{ secrets.TEST_SUPABASE_SESSION_POOLER }}
          EMAIL_PROVIDER: console
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789ab
          # The credential is the SESSION pooler, which allows only a handful of
          # concurrent clients — far fewer than the app's default pool of
          # 10 + 10 overflow. A test runner needs one connection at a time, and
          # asking for twenty against a cap of about four produces setup errors
          # late in the run that look like unrelated test failures.
          DB_POOL_SIZE: "2"
          DB_MAX_OVERFLOW: "3"
          DB_POOL_TIMEOUT: "30"
        # One gated command: validate the target, refuse production, migrate to
        # head, verify the revision, run pytest, run milestone verification.
        # It exits non-zero on any stage, and stops before touching anything if
        # the target is not a declared non-production test environment.
        #
        # ap-southeast-1 from a GitHub runner is a long way, and every query
        # pays that round trip: the suite takes ~10 minutes on a machine near
        # the region. The timeout is a hang guard, not a target.
        #
        # Raised from 75 to 120 on 2026-08-26. The comment above used to say
        # ~33 minutes; the suite has since grown to ~68-75 and was being KILLED
        # by this limit rather than failing — three consecutive runs died at 75
        # minutes with no failing assertion. 75 left essentially no margin for
        # a slow day against a remote database, and the alternatives were all
        # worse: deleting integration coverage, mocking Postgres semantics, or
        # over-subscribing the session pooler (which caps near four clients and
        # produces setup errors that masquerade as unrelated test failures).
        #
        # Raised again to 150 on 2026-08-26 after measuring. The first run to
        # complete under the 120 limit took 1:52:51 — six percent of headroom,
        # which is the same fragility that caused the original failures, just
        # further along. Observed honest runs are 68-113 minutes depending on
        # how the remote database is behaving, so 150 gives roughly a quarter
        # of margin.
        #
        # Still bounded rather than removed: a genuine hang must be caught.
        # This only has to be larger than a slow honest run, and 150 is set
        # from measurement rather than taste.
        #
        # Raised to 210 on 2026-09-22, again from measurement. The last green
        # run on main (35332730211, 4c40493) took 148 of its 150 minutes: no
        # margin left before this branch added its lifecycle tests. What grew is
        # identified, not guessed: the shared test database accumulates every
        # run's fixtures, and it now holds ~4,250 never-published pending
        # reviews that every moderator-queue read assesses in full (the queue
        # orders by policy, so it cannot paginate before assessing). Queue-heavy
        # tests went 64-232 s each over three weeks with no code change. The
        # structural fix is pruning those accumulated fixtures from
        # bluntly-ph-test — a destructive operation on that database, which
        # needs the owner's go-ahead — and it is recorded as follow-up work.
        #
        # Raised to 270 on 2026-09-28, from measurement again. Run 36402142427
        # (7316bc7) passed everything — 2,559 tests in 205.5 minutes, then
        # 59/59 milestones in 4.1 — and was cut off by this limit seconds
        # after printing "fully verified". 270 leaves ~28% over that.
        timeout-minutes: 270
        run: python -m scripts.bootstrap_test_env

  frontend:
    name: Frontend
    needs: guard
    if: ${{ needs.guard.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        # Guards the pure analytics transforms. Without this step the files
        # under tests/frontend are committed but never executed.
        run: npm run test:frontend
      - name: Production build
        # The build must not need runtime secrets; pages fetch at request time.
        run: npm run build
